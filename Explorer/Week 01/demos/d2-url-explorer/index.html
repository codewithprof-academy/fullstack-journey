<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Explorer — Week 01 Demo D2</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    input { width: 100%; font-size: 1.1rem; padding: .6rem; box-sizing: border-box; }
    .url { font-family: ui-monospace, monospace; font-size: 1.2rem; margin: 1.5rem 0; word-break: break-all; }
    .url span { padding: .1rem .2rem; border-radius: 4px; }
    .protocol { background: #ffe0b2; } .host { background: #c8e6c9; } .port { background: #e1bee7; }
    .path { background: #bbdefb; } .query { background: #fff9c4; } .hash { background: #f8bbd0; }
    table { border-collapse: collapse; width: 100%; } td, th { border: 1px solid #ccc; padding: .4rem .6rem; text-align: left; vertical-align: top; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>URL Explorer</h1>
  <p>Type or paste any web address. Each coloured part has a different job.</p>
  <label for="u">Web address (URL)</label>
  <input id="u" value="https://www.example.com:443/courses/maths?level=beginner&amp;page=2#reviews">
  <div class="url" id="coloured" aria-live="polite"></div>
  <table>
    <thead><tr><th>Part</th><th>Value</th><th>What it does</th></tr></thead>
    <tbody id="parts"></tbody>
  </table>
  <script>
    const jobs = {
      protocol: "The rules for talking. https = HTTP with encryption (the padlock).",
      hostname: "The domain name. DNS turns this into an IP address.",
      port: "Which 'door' on the server. Hidden when it is the default (443 for https, 80 for http).",
      pathname: "Which page or resource you want on that server.",
      search: "Extra information sent to the server (query string), as name=value pairs.",
      hash: "A spot on the page. It stays in the browser; it is NOT sent to the server."
    };
    const input = document.getElementById("u");
    function show() {
      const out = document.getElementById("coloured"), rows = document.getElementById("parts");
      rows.innerHTML = "";
      let url;
      try { url = new URL(input.value.trim()); }
      catch {
        out.replaceChildren();
        const error = document.createElement("span");
        error.className = "err";
        error.textContent = "That is not a complete URL yet — start with https://";
        out.appendChild(error);
        return;
      }
      const port = url.port ? ":" + url.port : "";
      out.replaceChildren();
      const part = (className, value) => {
        const span = document.createElement("span");
        span.className = className;
        span.textContent = value;
        out.appendChild(span);
      };
      part("protocol", `${url.protocol}//`);
      part("host", url.hostname);
      if (port) part("port", port);
      part("path", url.pathname);
      if (url.search) part("query", url.search);
      if (url.hash) part("hash", url.hash);
      const add = (name, value) => {
        const tr = document.createElement("tr");
        [name, value || "(none)", jobs[name]].forEach(t => { const td = document.createElement("td"); td.textContent = t; tr.appendChild(td); });
        rows.appendChild(tr);
      };
      add("protocol", url.protocol); add("hostname", url.hostname);
      add("port", url.port || `(default ${url.protocol === "https:" ? 443 : 80})`);
      add("pathname", url.pathname); add("search", url.search); add("hash", url.hash);
      url.searchParams.forEach((v, k) => add("search", `${k} = ${v}`));
    }
    input.addEventListener("input", show); show();
  </script>
</body>
</html>
